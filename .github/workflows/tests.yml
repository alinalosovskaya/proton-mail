name: Proton Mail UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Smoke suite
        run: >
          xvfb-run -a mvn -B test
          -Dsuite=testng-smoke.xml
          -Dbrowser=chrome
          -Denv=qa
        env:
          PROTON_TEST_EMAIL: ${{ secrets.PROTON_TEST_EMAIL }}
          PROTON_TEST_PASSWORD: ${{ secrets.PROTON_TEST_PASSWORD }}
        continue-on-error: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: TestNG Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Archive failure screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots
          path: target/screenshots/
          if-no-files-found: ignore

      - name: Archive logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-logs
          path: logs/
          if-no-files-found: ignore